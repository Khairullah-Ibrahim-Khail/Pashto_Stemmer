[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pashto-stemmer"
version = "0.1.0"
description = "A grammar-driven rule-based stemmer for the Pashto language (no ML)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Khairullah Ibrahim Khail", email = "ibrahimkhil976@gmail.com" }]
keywords = [
    "pashto", "stemming", "stemmer", "nlp", "morphology",
    "low-resource", "information-retrieval", "rule-based", "dictionary",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Pashto",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
# Only needed for --excel; CSV and TSV work with the standard library alone.
excel = ["openpyxl>=3.0"]
experiments = ["matplotlib>=3.5", "pandas>=1.3"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/Khairullah-Ibrahim-Khail/Pashto_Stemmer"
Repository = "https://github.com/Khairullah-Ibrahim-Khail/Pashto_Stemmer"
Issues = "https://github.com/Khairullah-Ibrahim-Khail/Pashto_Stemmer/issues"

[project.scripts]
pashto-stem = "pashto_stemmer.cli:main"

[tool.setuptools]
packages = ["pashto_stemmer"]

[tool.setuptools.package-data]
pashto_stemmer = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
